name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Tests
        # Tests that need third-party ocean data or generated runs are skipped with a stated reason (tests/conftest.py).
        run: python -m pytest -q -rs
