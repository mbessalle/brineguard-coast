# SSSF (Super Simple Software Factory) configuration for BrineGuard Coast.
#
# Establishes a tiered model stack and routing policy so that AI Developer
# Workflows (ADWs) route each phase to the cheapest reliable actor:
# deterministic code > Tier 2 workhorse agents > Tier 1 SOTA agents.
#
# Read by adws/adw_scout.py, adws/adw_plan_build_test.py, and
# adws/adw_simple_sdlc.py. Edit this file (not the scripts) to change which
# model backs a given role.

version: 1

# Paths no worker diff may touch (enforced by adws/gates.py
# protected_paths_untouched — "agents must not edit the machinery that grades
# them", SSSF pattern). The orchestrator edits these only deliberately.
protected_files:
  - adws/gates.py
  - tools/pipeline_verify.py
  - tools/model_preflight.py
  - sssf.config.yaml
  - FREEZE.md
  - docs/CLAIMS.md
  - runs/
  - evidence/
  - adw_data/dispatch_ledger.jsonl

tiers:
  tier_1_sota:
    description: >
      High-depth reasoning: architecture planning, breaking down complex
      requirements, final semantic verification of a diff against a plan.
      Reserved for phases where getting the structure wrong is expensive to
      undo. This tier is the orchestrating session itself (invoked headless
      via the `claude` CLI for sub-phases that need a fresh context window).
    model: claude-fable-5
    roles:
      - planner
      - reviewer
    # Independent second-opinion reviews (avoids self-review bias) route to a
    # non-Claude frontier model:
    independent_reviewer_route: reviewer_independent

  tier_2_workhorse:
    description: >
      Code generation against a strict plan, file edits, code search/recon,
      diff summarization, documentation writing. Cheaper and faster than
      Tier 1; used for anything that follows an already-decided plan rather
      than making structural decisions. Values are route names (see `routes`).
    models:
      builder: builder
      documenter: documenter
      scout: scout
    roles:
      - builder
      - scout
      - documenter

  tier_3_deterministic:
    description: >
      Zero-token local code execution. All quality gates, tests, and
      artifact/schema validation run here, never via an LLM call. See
      adws/gates.py.
    engine: local
    cost_tokens: 0
    roles:
      - quality_gate
      - test_runner
      - artifact_verifier
      - schema_verifier

# ---------------------------------------------------------------------------
# Backends and routes — VERIFIED live 2026-08-25 via tools/probe.py.
# A route = backend + model. Re-verify with `python3 tools/probe.py` and
# re-check pricing via `python3 tools/openrouter_call.py models <filter>`
# before trusting numbers. Keys: gitignored .env (OPENROUTER_API_KEY),
# .env.gemini_key; OpenAI via pi openai-codex OAuth (~/.pi/agent/auth.json).
# ---------------------------------------------------------------------------
# Model-selection policy (mandatory for any route change):
# 1. FRESHNESS: tools/model_freshness.py diffs pinned routes vs the live
#    catalog at every session start (via session_brief); flagged families get
#    a neutral web search ("latest model by <company>") + smoke test.
# 2. ALLOCATION CRITERIA — every route must be justified by all three, with
#    evidence recorded next to the route:
#    - size/proficiency: published benchmark standing for the ROLE's task class
#      (coding for builders, reasoning for reviewers, none needed for utility)
#    - cost: usd_per_m in/out (subscription routes = 0 marginal, prefer them)
#    - fit: output discipline (e.g. reasoning-leak models rejected for terse
#      utility roles), context length, agentic-harness support
# 3. Higher-proficiency-at-equal-cost wins; equal-proficiency-at-lower-cost
#    wins; user-pinned routes (builder=deepseek-v4-pro) change only by user.
backends:
  session:        # the orchestrating Claude Code session itself (Tier 1)
    invoke: interactive
  claude-cli:
    invoke: [claude, -p, "{prompt}", --model, "{model}", --output-format, text]
  pi-openai-codex:  # full agentic coder on the OpenAI ChatGPT subscription
    # OAuth tokens in ~/.pi/agent/auth.json (pi /login, provider openai-codex);
    # $0 marginal cost. CATALOG CEILING: pi 0.73.1 tops out at gpt-5.5 and
    # SILENTLY falls back on unknown models (caught live 2026-08-26; blocked
    # by tools/model_preflight.py). GPT-5.6 family is NOT reachable here.
    invoke: [pi, --provider, openai-codex, --model, "{model}", -p, --no-session,
             --append-system-prompt, "{role_prompt}", "{prompt}"]
  codex-cli:  # READMITTED for review roles only (user decision 2026-08-26):
    # the only route to gpt-5.6-sol on the subscription. Validates models
    # server-side with a hard 400 on unknown ids (verified: no silent fallback).
    invoke: [codex, exec, -m, "{model}", "{prompt}"]
  pi-openrouter:  # full agentic coder: read/bash/edit/write tools
    invoke: [pi, --provider, openrouter, --model, "{model}", -p, --no-session,
             --append-system-prompt, "{role_prompt}", "{prompt}"]
    env: {OPENROUTER_API_KEY: from tools/openrouter_call.py:load_key}
  openrouter-api: # single-turn only (no tools); empty role_prompt => no system message
    invoke: [python3, tools/openrouter_call.py, chat, -m, "{model}", -s, "{role_prompt}", "{prompt}"]

routes:
  planner:              {backend: session,        model: claude-fable-5}
  reviewer:             {backend: session,        model: claude-fable-5}
  # Default independent reviewer: real gpt-5.6-sol via codex CLI (the pi
  # route caps at gpt-5.5). kimi kept for /fh-debate diversity.
  reviewer_independent: {backend: codex-cli, model: gpt-5.6-sol,
                         role_prompt: adws/prompts/reviewer.md}  # real 5.6-sol, verified 2026-08-26
  reviewer_kimi:        {backend: openrouter-api, model: moonshotai/kimi-k3,
                         usd_per_m_in: 3.00, usd_per_m_out: 15.00,
                         role_prompt: agent-system-prompt.md}  # SOTA comms contract as system prompt
  # Qwen flagship (2.4T, 2026-08-03; benchmarks above kimi-k3, cheaper):
  reviewer_qwen_max:    {backend: openrouter-api, model: qwen/qwen3.8-max,
                         usd_per_m_in: 2.00, usd_per_m_out: 6.00,
                         role_prompt: agent-system-prompt.md}
  builder:              {backend: pi-openrouter,  model: deepseek/deepseek-v4-pro,
                         usd_per_m_in: 0.52, usd_per_m_out: 1.04,
                         role_prompt: adws/prompts/builder.md}   # DEFAULT coder (user-confirmed)
  builder_escalation:   {backend: codex-cli, model: gpt-5.6-sol,
                         role_prompt: adws/prompts/builder.md}   # subscription, no per-token cost
  scout:                {backend: pi-openrouter,  model: deepseek/deepseek-v4-flash,
                         usd_per_m_in: 0.056, usd_per_m_out: 0.11,
                         role_prompt: adws/prompts/scout.md}
  documenter:           {backend: openrouter-api, model: openai/gpt-5-mini,
                         usd_per_m_in: 0.25, usd_per_m_out: 2.00,
                         role_prompt: adws/prompts/documenter.md}
  # Lightweight C/D tier via OpenRouter (smoke-tested 2026-08-25; :free = $0):
  lightweight:          {backend: openrouter-api, model: "nvidia/nemotron-3.5-lightning:free",
                         usd_per_m_in: 0.0, usd_per_m_out: 0.0}
  # Qwen 3.8-27B is the exact model named in system-orchestration.md's
  # Lightweight tier (released 2026-08-03; verified via web search + smoke).
  lightweight_qwen:     {backend: openrouter-api, model: qwen/qwen3.8-27b,
                         usd_per_m_in: 0.425, usd_per_m_out: 2.55}
  # NOTE: qwen3.5-flash rejected — leaks reasoning chain into content. Pinned
  # IDs preferred over "-latest" aliases so FREEZE.md reproducibility holds.

# ---------------------------------------------------------------------------
# Model anonymization (system-orchestration.md §1). NEVER expose real model
# names to peer agents in multi-agent prompts (fan-out opinions, debates,
# collaboration) — use these role aliases to avoid bias, sycophancy toward
# named models, or adversarial behavior. The orchestrator's own reports to the
# user MAY map aliases back to real models.
# ---------------------------------------------------------------------------
anonymization:
  enabled: true
  aliases:
    planner: Architect/Rune
    reviewer: Reviewer/Vale
    reviewer_independent: Reviewer/Sable
    builder: Builder-1/Flux
    builder_escalation: Builder-2/Drift
    scout: Scout/Wisp
    documenter: Scribe/Quill
    lightweight: Utility-1/Mote
    lightweight_qwen: Utility-2/Grit
    reviewer_kimi: Reviewer/Onyx
    reviewer_qwen_max: Reviewer/Jade

# Lightweight tier (C/D, system-orchestration.md §2): cheap sub-tasks, syntax
# checks, single-file audits. Filled via OpenRouter instead of local models —
# routes.lightweight (nemotron :free tier, $0) and routes.lightweight_qwen —
# both smoke-tested 2026-08-25. A local runtime (ollama) remains an option if
# offline/zero-latency utility calls are ever needed.

# ---------------------------------------------------------------------------
# Routing policy
# ---------------------------------------------------------------------------
routing:
  default_tier_by_role:
    planner: tier_1_sota
    reviewer: tier_1_sota
    builder: tier_2_workhorse
    scout: tier_2_workhorse
    documenter: tier_2_workhorse
    quality_gate: tier_3_deterministic
    test_runner: tier_3_deterministic
    artifact_verifier: tier_3_deterministic
    schema_verifier: tier_3_deterministic

  # Always try deterministic code before spending a single token verifying
  # syntax, formats, or basic execution.
  code_over_llm: true

  retry_policy:
    # Bounded retry: on a gate failure, hand the exact stderr/stdout back to
    # the Tier 2 builder for a fix attempt. Do not re-plan on every failure.
    max_builder_retries: 3
    retry_actor: builder
    retry_input: gate_failure_output   # raw stdout/stderr only, not a summary
    # Escalate to the Tier 1 planner only when retries are exhausted, or the
    # gate failure indicates a structural problem (see escalation_triggers).
    escalate_to: planner
    escalate_after_retries_exhausted: true
    escalation_triggers:
      - retries_exhausted
      - plan_contradicted_by_diff
      - repeated_identical_failure   # same gate fails the same way twice
    # Model-escalation ladder (mirrors Orca's 3-strike circuit breaker):
    # builder (deepseek-v4-pro) -> builder_escalation (pi-openai-codex/gpt-5.6-sol)
    # -> planner (Tier 1 structural rethink). Retries stay on the same rung
    # with exact stderr only; a rung change resets the retry budget once.
    model_escalation: [builder, builder_escalation, planner]

  # Task-type allocation hints:
  #   recon/search/"where is X"        -> scout (near-free)
  #   mechanical edits, tests, docs    -> builder / documenter cheap rungs
  #   multi-file features              -> builder (default rung)
  #   structural/architectural changes -> planner designs first, builder executes
  #   anything touching src/brineguard numerics: builder MUST run full pytest
  #   before reporting (suite ~2 s; also enforced by the PostToolUse hook).

# ---------------------------------------------------------------------------
# Context handoff convention
# ---------------------------------------------------------------------------
# Phases communicate via filesystem envelopes instead of passing raw
# conversation history between agent invocations. Every ADW session writes
# here, keyed by a session id (timestamp + short uuid, e.g.
# 20260825_062652_4ca60af3).
handoff:
  session_root: adw_data/sessions
  handoff_subdir: context_handoff
  # Resolved path for session <session_id>:
  #   adw_data/sessions/<session_id>/context_handoff/
  envelopes:
    planner:
      outputs: [plan.md, plan.json]
      plan_json_keys: [status, summary, changed_files]
    builder:
      consumes: [plan.md]
      outputs: [envelope.json]
      envelope_json_keys: [status, summary, changed_files]
    tester:
      outputs: [test_log.txt, gate_results.json]
    reviewer:
      consumes: [plan.md]
      diffs_against: plan.md
      outputs: [review.md, review.json]
    documenter:
      outputs: [docs_envelope.json]

# ---------------------------------------------------------------------------
# Workflows (see adws/README.md for details)
# ---------------------------------------------------------------------------
workflows:
  adw_scout:
    description: Fast, read-only recon on codebase/architecture.
    phases:
      - {role: scout, tier: tier_2_workhorse, mutates: false}

  adw_plan_build_test:
    description: Planner -> Builder -> Test/Gate -> commit.
    phases:
      - {role: planner, tier: tier_1_sota}
      - {role: builder, tier: tier_2_workhorse}
      - {role: quality_gate, tier: tier_3_deterministic}
      - {role: git_commit, tier: tier_3_deterministic}

  adw_simple_sdlc:
    description: >
      Request -> Plan (SOTA) -> Build (Workhorse) -> Test (Deterministic) ->
      Review (SOTA) -> Document (Workhorse) -> Commit (Deterministic).
    phases:
      - {role: planner, tier: tier_1_sota}
      - {role: builder, tier: tier_2_workhorse}
      - {role: quality_gate, tier: tier_3_deterministic}
      - {role: reviewer, tier: tier_1_sota}
      - {role: documenter, tier: tier_2_workhorse}
      - {role: git_commit, tier: tier_3_deterministic}

# ---------------------------------------------------------------------------
# Deterministic gates (adws/gates.py)
# ---------------------------------------------------------------------------
gates:
  python: .venv/bin/python
  checks:
    - name: pytest
      required: true
      command: [pytest]
    - name: ruff
      required: false   # skipped gracefully with a note if not installed
      command: [-m, ruff, check, .]
    - name: mypy
      required: false   # skipped gracefully with a note if not installed
      command: [-m, mypy, src]
